[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowbox"
version = "0.1.0"
description = "Turn an image into layered SVGs for laser-cutting a shadow box."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Lance Lacoste" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
    "scikit-image>=0.22",
    "potracer>=0.0.4",
    "svgwrite>=1.4",
    "shapely>=2.0",
    "svgpathtools>=1.6",
    "rembg[cpu]>=2.0.50",
    "typer>=0.12",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "pre-commit>=3.7",
]

[project.scripts]
shadowbox = "shadowbox.cli:app"

[project.urls]
Repository = "https://github.com/llacoste/shadowbox"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadowbox = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle + pyflakes
    "I",                  # isort
    "UP",                 # pyupgrade
    "B",                  # bugbear
    "C4",                 # comprehensions
    "SIM",                # simplify
    "PTH",                # use-pathlib
    "RUF",                # ruff-specific
]
ignore = [
    "E501",               # handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]     # pytest assert patterns
"src/shadowbox/cli.py" = ["B008"]      # Typer requires function-call defaults
"src/shadowbox/web/app.py" = ["B008"]  # FastAPI requires function-call defaults

[tool.mypy]
# Type-check assuming the runtime Python version of the Docker image.
# We declare `requires-python = ">=3.11"` for downstream consumers, but the
# dep ecosystem (scikit-image → tifffile, etc.) uses PEP 695 syntax that
# only parses on 3.12+ — so locking mypy to 3.11 here would blow up trying
# to read transitive deps. The test matrix still validates 3.11/3.12/3.13.
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src"]
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
