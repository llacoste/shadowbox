name: CI

# Three-stage pipeline modeled on convert_to_hex:
#
#   verify  → fast checks on every commit (lint, format, types, unit tests)
#   build   → docker image + smoke test, runs on PRs and master pushes
#   deploy  → publish image to GHCR and cut a GitHub Release, master only
#
# Skipped stages (e.g. deploy on a PR) show as skipped in the Actions UI,
# not failed.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/shadowbox
  PRIMARY_PYTHON: "3.13"

jobs:
  # ─────────────────────────── Stage 1: Verify ───────────────────────────
  # Runs on every push and PR. Each phase appears as a child node under
  # Verify in the Actions graph and runs in parallel.
  verify:
    name: Verify · ${{ matrix.phase }}${{ matrix.python-version && format(' (py{0})', matrix.python-version) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: Lint
            command: ruff check src tests
            python-version: "3.13"
          - phase: Format
            command: ruff format --check src tests
            python-version: "3.13"
          - phase: Types
            command: mypy src
            python-version: "3.13"
          - phase: Unit
            command: pytest --cov=shadowbox
            python-version: "3.11"
          - phase: Unit
            command: pytest --cov=shadowbox
            python-version: "3.12"
          - phase: Unit
            command: pytest --cov=shadowbox
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Cache rembg model
        if: matrix.phase == 'Unit'
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-model-v1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .[web,dev]

      - name: ${{ matrix.phase }}
        run: ${{ matrix.command }}

  # ─────────────────────────── Stage 2: Build ────────────────────────────
  # Three parallel phases:
  #
  #   Security  → Trivy static scan of the built image (OS + dep CVEs)
  #   Quality   → pre-commit hooks across the repo
  #   Image     → docker build + end-to-end CLI smoke test
  build:
    name: Build · ${{ matrix.phase }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - phase: Security
            mode: docker
          - phase: Quality
            mode: python
          - phase: Image
            mode: docker
    steps:
      - uses: actions/checkout@v4

      # ── Docker-based phases (Security, Image) ──
      - if: matrix.mode == 'docker'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: matrix.mode == 'docker'
        name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shadowbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Python-based phase (Quality) ──
      - if: matrix.mode == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip

      - if: matrix.mode == 'python'
        name: Install package + pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install .[web,dev]

      # ── Per-phase check ──
      # Report-only for now: log findings without blocking PRs. Day-zero OS
      # CVEs we can't fix shouldn't gate merges on a personal repo. Tighten
      # to exit-code: '1' once a triage process exists.
      - if: matrix.phase == 'Security'
        name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: shadowbox:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - if: matrix.phase == 'Quality'
        name: pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - if: matrix.phase == 'Image'
        name: CLI smoke test
        run: |
          mkdir -p tmp
          docker run --rm -v "${{ github.workspace }}:/work" shadowbox:ci \
            slice tests/fixtures/mountains.png \
              --layers 3 --threshold-mode equal --kerf-mm 0 \
              --output /work/tmp
          test -s tmp/layer_1.svg
          head -1 tmp/layer_1.svg | grep -q '<svg'
          test -s tmp/preflight.txt

  # ─────────────────────────── Stage 3: Deploy ───────────────────────────
  # Publishes the verified, built artifact. Push the image to GHCR under a
  # semver tag and :latest, and create a GitHub Release with usage
  # instructions. Only runs on push to master.
  #
  # Versioning: `[project].version` in pyproject.toml is the source of
  # truth. To release, bump it and merge to master. Re-merges without a
  # version bump no-op the publish steps.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve release tag from pyproject.toml
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -E '^version = "' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::Could not parse [project].version from pyproject.toml"
            exit 1
          fi
          tag="v${version}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::notice::Release ${tag} already exists — skipping publish. Bump version in pyproject.toml to ship a new release."
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Releasing ${tag}"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.version.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push to GHCR
        if: steps.version.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            docker pull ${{ env.IMAGE_NAME }}:latest
            ```

            ## CLI usage

            ```
            docker run --rm -v "$(pwd):/work" \
              ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
              slice INPUT.png --layers 5 --output ./out/
            ```

            ## Web UI

            ```
            docker run --rm -p 8000:8000 \
              ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} \
              serve --host 0.0.0.0
            # open http://localhost:8000
            ```
